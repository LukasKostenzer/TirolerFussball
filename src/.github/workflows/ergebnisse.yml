
name: UnterHaustria Ergebnisautomatik

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  ergebnisse:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programm starten
        env:
          BLUESKY_HANDLE: tirolerfussball.bsky.social
        run: python src/main.py
